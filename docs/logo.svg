<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" fill="none">
  <defs>
    <linearGradient id="fbw-bg" x1="0" y1="0" x2="880" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="fbw-slide-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f3aa3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#131e8c" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="fbw-slide-mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8083ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#494bd6" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="fbw-slide-front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#262a31"/>
      <stop offset="100%" stop-color="#181c22"/>
    </linearGradient>
    <linearGradient id="fbw-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c0c1ff"/>
      <stop offset="55%" stop-color="#8083ff"/>
      <stop offset="100%" stop-color="#4edea3"/>
    </linearGradient>
    <filter id="fbw-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#05070b" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Full-Bleed Square Banner Background (No rounded outer border) -->
  <rect width="880" height="240" fill="url(#fbw-bg)"/>

  <!-- Left Icon Mark (Frameless, scaled up) -->
  <g transform="translate(24, 18) scale(1.16)">
    <!-- Back Slide -->
    <g transform="rotate(-14 72 93)">
      <rect x="28" y="43" width="82" height="90" rx="8" fill="url(#fbw-slide-back)" stroke="#8083ff" stroke-opacity="0.4" stroke-width="1.5"/>
    </g>

    <!-- Middle Slide -->
    <g transform="rotate(-6 84 93)" filter="url(#fbw-shadow)">
      <rect x="39" y="42" width="88" height="91" rx="9" fill="url(#fbw-slide-mid)" stroke="#c0c1ff" stroke-opacity="0.6" stroke-width="1.5"/>
    </g>

    <!-- Front Hero Slide -->
    <g filter="url(#fbw-shadow)">
      <rect x="51" y="41" width="95" height="94" rx="10" fill="url(#fbw-slide-front)" stroke="url(#fbw-accent)" stroke-width="2.5"/>
      <line x1="52" y1="57" x2="145" y2="57" stroke="#31353c" stroke-width="1.5"/>
      <circle cx="62" cy="49" r="2" fill="#8083ff"/>
      <circle cx="69" cy="49" r="2" fill="#4edea3"/>

      <!-- M + Arrow -->
      <path d="M64 74V101M64 74L74.5 87.5L85 74M85 74V101" stroke="#dfe2eb" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M99 87.5H125M125 87.5L114 76.5M125 87.5L114 98.5" stroke="#4edea3" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Triple Dash Slide Separator -->
      <rect x="63" y="116" width="16" height="3.5" rx="1.75" fill="#8083ff"/>
      <rect x="83" y="116" width="16" height="3.5" rx="1.75" fill="#8083ff" opacity="0.7"/>
      <rect x="103" y="116" width="16" height="3.5" rx="1.75" fill="#4edea3"/>
      <polygon points="133,115 136,117.75 133,120.5 130,117.75" fill="#4edea3"/>
    </g>
  </g>

  <!-- Wordmark & Tagline -->
  <g transform="translate(240, 0)">
    <!-- Primary Title: FLIPBOOK -->
    <text x="0" y="112" fill="#dfe2eb" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-0.03em">FLIPBOOK</text>

    <!-- MD Pill Badge -->
    <rect x="338" y="62" width="86" height="44" rx="10" fill="#8083ff" fill-opacity="0.18" stroke="#8083ff" stroke-width="2"/>
    <text x="381" y="92" fill="#c0c1ff" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="26" font-weight="700" text-anchor="middle" letter-spacing="0.04em">.MD</text>

    <!-- Tagline: Markdown in. Slides out. -->
    <g transform="translate(2, 142)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#4edea3" transform="translate(0, 7)"/>
      <text x="22" y="18" fill="#c7c4d7" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="20" font-weight="500" letter-spacing="0.02em">
        Markdown in. <tspan fill="#4edea3" font-weight="700">Slides out.</tspan>
      </text>
    </g>

    <!-- Bottom Slide Divider Ornament -->
    <line x1="2" y1="184" x2="48" y2="184" stroke="#8083ff" stroke-width="3" stroke-linecap="round"/>
    <line x1="58" y1="184" x2="104" y2="184" stroke="#8083ff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
    <line x1="114" y1="184" x2="160" y2="184" stroke="#4edea3" stroke-width="3" stroke-linecap="round"/>
    <line x1="172" y1="184" x2="584" y2="184" stroke="#262a31" stroke-width="2"/>
  </g>
</svg>
